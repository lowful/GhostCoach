<!--
  Occlara mark: an aperture, reduced to two elements.

  Third version, and the simplest. One ring of three arcs was inert; two rings
  with offset gaps had depth but was busy at 16px, where six arc ends and a
  pupil turn into noise. This is one ring, one gap, one pupil.

  The single gap does all the work. A ring plus a dot is a target or a reticle;
  break the ring once and it becomes an aperture, an eye, a lens. That matters
  because `occl-` reads as OCCLUDE, to block vision, so the mark has to argue
  OPENING as plainly as it can, and it pairs with the `-clara` half, clarus,
  clear.

  The gap is 48 degrees, sitting from roughly one o'clock to two. Placing it off
  the vertical axis is deliberate: a gap at the top reads as a broken circle,
  and a gap on the diagonal reads as an aperture blade pulling back.

  Dashes rather than a hand-plotted arc. Circumference is 2*pi*24 = 150.796, so
  a 48 degree gap is 20.106 and the remaining stroke is 130.690. Hand-plotting
  the arc drifts a fraction of a degree and the ends stop looking parallel.

  color="#FFFFFF" on the root is load-bearing. Nearly every surface uses this
  file through an <img>, and an external SVG loaded that way is its own
  document: currentColor resolves against the SVG, not the page, so without a
  default it falls back to black and the mark is invisible on the dark ground.

  Sizes it must survive: 16px in the Windows tray, 20px in a panel header. At
  16px the stroke lands near 1.25px and the pupil near 3px. Two elements is what
  makes that legible.
-->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg" color="#FFFFFF" role="img" aria-label="Occlara">
  <circle cx="32" cy="32" r="24"
          fill="none" stroke="currentColor" stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="130.690 20.106"
          transform="rotate(-54 32 32)"/>
  <circle cx="32" cy="32" r="6" fill="currentColor"/>
</svg>
