<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- font-src is required: theme.css loads the bundled Geist woff2 files, and
       under default-src 'none' they were silently blocked and the wordmark fell
       back to Arial. Everything else stays denied. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self';" />
  <title>Occlara</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <!-- The aperture opens: the ring draws, the gaps appear, the pupil arrives.
       Three beats and nothing else: no grid, no rings, no progress bar. The
       silhouette is inlined so the outline and the fill can be separate paths,
       which is what makes the draw-on possible. Keep in sync with
       assets/logo-mark.svg if the logo changes. -->
  <div class="stage">
    <!-- The aperture opens: the ring draws itself, then the pupil scales in.
         An aperture OPENING is the whole argument of the mark, so the animation
         has to move outward rather than flood or fade. -->
    <svg class="mark" viewBox="0 0 64 64" width="96" height="96" role="img" aria-label="Occlara">
      <!-- pathLength normalises each ring to 1, so the dash maths below does not
           depend on the real circumference. -->
      <circle class="ring" cx="32" cy="32" r="24" pathLength="1"
              fill="none" stroke="currentColor" stroke-width="5"
              stroke-linecap="round" transform="rotate(-54 32 32)"/>
      <circle class="pupil" cx="32" cy="32" r="6" fill="currentColor"/>
    </svg>

    <div class="wordmark">OCCLARA</div>
  </div>
</body>
</html>
