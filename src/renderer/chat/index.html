<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Ask Coach</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Ask Coach</h2>
        <span id="agent-chip" class="chip-agent" hidden></span>
      </div>
      <button id="close" class="icon-btn no-drag" title="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </header>

    <div class="body" id="thread">
      <div class="intro" id="intro">
        <p class="intro-lead">Match over? Rough round? Let's break it down.</p>
        <div class="starters">
          <button class="starter">
            <span class="s-ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="10" height="16" rx="2"/><path d="M8 8H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2"/></svg></span>
            <span>What did I do badly and what did I do well this session?</span>
          </button>
          <button class="starter">
            <span class="s-ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg></span>
            <span>What should I focus on to rank up?</span>
          </button>
          <button class="starter">
            <span class="s-ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-4 12.7V19a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3.3A7 7 0 0 0 12 3z"/><circle cx="9.6" cy="11" r="1.4"/><circle cx="14.4" cy="11" r="1.4"/></svg></span>
            <span>Why do I keep dying in the same spots?</span>
          </button>
        </div>
      </div>
    </div>

    <form class="composer no-drag" id="composer">
      <input id="input" type="text" placeholder="Ask your coach anything"
             maxlength="500" autocomplete="off" spellcheck="false" />
      <button id="send" class="send" type="submit" title="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </form>
  </div>

  <script src="../shared/i18n-apply.js"></script>
  <script src="chat.js"></script>
</body>
</html>
