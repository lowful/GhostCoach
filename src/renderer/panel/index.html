<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Occlara</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/tip-visuals.css" />
  <link rel="stylesheet" href="../shared/dropdown.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="panel glass">
    <div class="head drag">
      <div class="brand">
        <img class="mark" src="../../../assets/logo-mark.svg" alt="" width="20" height="20" />
        <span class="name">Occlara</span>
      </div>
      <div class="head-actions">
        <!-- League only, and hidden otherwise. A control that does nothing for
             the game you are playing is worse than one that is not there. -->
        <button id="learn" class="icon-btn no-drag" title="Learn League" aria-label="Learn League" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 015.5 4H10a2 2 0 012 2v13a1.5 1.5 0 00-1.5-1.5H4z"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H14a2 2 0 00-2 2v13a1.5 1.5 0 011.5-1.5H20z"/></svg>
        </button>
        <button id="stats" class="icon-btn no-drag" title="View Full Stats" aria-label="View Full Stats" data-i18n-title="panel.stats">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 20V11"/><path d="M12 20V4"/><path d="M18 20v-6"/></svg>
        </button>
        <button id="chat" class="icon-btn no-drag" title="Ask Coach" aria-label="Ask Coach" data-i18n-title="panel.askCoach">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button id="history" class="icon-btn no-drag" title="Tip history" aria-label="Tip history" data-i18n-title="panel.history">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button id="settings" class="icon-btn no-drag" title="Settings (Ctrl+Shift+S)" aria-label="Settings" data-i18n-title="common.settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="minimize" class="icon-btn no-drag" title="Minimize (Ctrl+Shift+M)" aria-label="Minimize">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button id="quit" class="icon-btn no-drag danger" title="Quit" aria-label="Quit" data-i18n-title="common.quit">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <!-- Agent check bubble: appears when coaching starts, vanishes once answered -->
    <div id="agent-bubble" class="agent-bubble no-drag" hidden>
      <div class="ab-row" id="ab-detect">
        <span class="ab-spin"></span>
        <span class="ab-q">Reading your agent...</span>
      </div>
      <div class="ab-row" id="ab-ask" hidden>
        <span class="ab-q">Playing <b id="ab-name">your agent</b>?</span>
        <div class="ab-btns">
          <button id="ab-yes" class="ab-btn ok" title="Yes, that's right"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></button>
          <button id="ab-no"  class="ab-btn no" title="No, let me pick"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
        </div>
      </div>
      <form class="ab-row" id="ab-form" hidden>
        <input id="ab-input" class="ab-input" type="text" placeholder="Type your agent"
               maxlength="16" autocomplete="off" spellcheck="false" />
        <button id="ab-go" class="ab-btn ok" type="submit" title="Set agent">Set</button>
      </form>
      <div class="ab-row" id="ab-done" hidden>
        <span class="ab-q"><b id="ab-done-name"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></b> locked in</span>
      </div>
      <div id="ab-quick" class="ab-quick" hidden>
        <span class="ab-quick-label">Your mains:</span>
        <div id="ab-quick-btns" class="ab-quick-btns"></div>
      </div>
    </div>

    <!-- The session readout. Was a single line of text reading
         "Idle . 0 tips"; it is now a bordered block with the live state on the
         left and the count as a labelled figure on the right. Structuring the
         same two facts is most of what separates a tool from a widget, and it
         gives the count somewhere to grow as more of them arrive. -->
    <div class="session">
      <div class="s-state">
        <span class="dot" id="dot"></span>
        <span id="status-text">Idle</span>
      </div>
      <div class="s-stat">
        <b id="tipcount">0 tips</b>
        <span class="s-lbl">this session</span>
      </div>
    </div>

    <div class="controls">
      <button id="toggle" class="btn btn-primary toggle">
        <span class="t-ico"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M8 5.2v13.6a.6.6 0 0 0 .93.5l10.2-6.8a.6.6 0 0 0 0-1l-10.2-6.8A.6.6 0 0 0 8 5.2z"/></svg></span><span class="t-label" data-i18n="panel.start">Start Coaching</span>
      </button>
      <button id="pause" class="icon-btn lg" title="Pause / Resume (Ctrl+Shift+P)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5v14"/><path d="M15 5v14"/></svg>
      </button>
    </div>

    <!-- One-off hint: slides in from the right, pointing at the minimize button -->
    <div id="nudge" class="nudge no-drag" hidden>
      <div class="nudge-body">
        <b>Tuck me away while you play</b>
        <span>Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> to minimize. Tips keep coming on the overlay.</span>
      </div>
      <button id="nudge-x" class="nudge-x" title="Got it" aria-label="Dismiss"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </div>

    <button class="last-tip no-drag" id="last-tip" title="Open tip history">
      <span class="lt-dot"></span>
      <span class="lt-text" data-i18n="panel.noTips">No tips yet, start coaching.</span>
    </button>
  </div>

  <script src="../shared/dropdown.js"></script>
  <script src="../shared/i18n-apply.js"></script>
  <script src="../shared/tip-visuals.js"></script>
  <script src="panel.js"></script>
</body>
</html>
