<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Occlara Learn</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="learn.css" />
</head>
<body>
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Learn</h2>
      </div>
      <div class="hprog no-drag" id="hprog">
        <span id="prog-text" class="hprog-text">0 of 0</span>
        <div class="hprog-bar"><i id="prog-fill"></i></div>
      </div>
      <button id="close" class="icon-btn no-drag" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </header>

    <!-- DASHBOARD: everything at once. The player picks what to work on and
         ticks it off over time. The coach still says what it would pick, but it
         suggests rather than gates: a lesson list you cannot leave is a course,
         and a course is not what someone climbing ranked wants at 1am. -->
    <main id="dash" class="body">

      <!-- WHO IS LEARNING. Rank band and role are graded inputs, not
           preferences: the role decides which skills apply at all and the band
           decides every sourced target, so they are edited here rather than
           buried in Settings. -->
      <section class="profile">
        <div class="prof-row">
          <span class="prof-label">Rank</span>
          <div class="seg" id="band-seg"></div>
        </div>
        <div class="prof-row">
          <span class="prof-label">Role</span>
          <div class="seg" id="role-seg"></div>
        </div>
        <p id="prof-note" class="prof-note"></p>
      </section>

      <!-- WHAT THE COACH WOULD PICK. One skill, its target for the next game,
           and last game's result. Collapsible, because a suggestion that cannot
           be dismissed is an instruction. -->
      <section id="focus" class="focus">
        <div class="f-top">
          <span class="f-eyebrow">Suggested next</span>
          <span id="f-track" class="a-track"></span>
        </div>
        <h3 id="f-title"></h3>
        <p id="f-mistake" class="l-mistake"></p>

        <div class="a-numbers">
          <div class="a-num">
            <div class="a-num-label">Target next game</div>
            <div id="f-target" class="a-num-value"></div>
            <div id="f-target-note" class="a-num-note"></div>
          </div>
          <div class="a-num">
            <div class="a-num-label">Last game</div>
            <div id="f-last" class="a-num-value"></div>
            <div id="f-last-note" class="a-num-note"></div>
          </div>
        </div>

        <p id="f-why" class="a-why"></p>
        <button id="f-open" class="btn btn-primary full">Read this lesson</button>
      </section>

      <!-- THE TWELVE, ALWAYS VISIBLE AND ALWAYS PICKABLE. Each row ticks off in
           place; opening it is a separate click on the title. -->
      <p class="intro" id="intro"></p>
      <div id="tracks"></div>

      <section class="starters">
        <h3>Your champions</h3>
        <p class="hint" id="champ-hint"></p>
        <div id="starters" class="starter-lanes"></div>
      </section>
    </main>

    <!-- LESSON: one at a time -->
    <main id="lesson" class="body" hidden>
      <button id="back" class="back-btn">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span id="back-label">Back</span>
      </button>

      <div class="l-head">
        <span id="l-track" class="l-track"></span>
        <h3 id="l-title"></h3>
        <p id="l-mistake" class="l-mistake"></p>
      </div>

      <div id="l-body" class="l-body"></div>

      <section class="practice">
        <h4>Practice</h4>
        <div id="l-practice"></div>
      </section>

      <button id="l-done" class="btn btn-primary full">Mark complete</button>
    </main>
  </div>

  <script src="../shared/i18n-apply.js"></script>
  <script src="learn.js"></script>
</body>
</html>
