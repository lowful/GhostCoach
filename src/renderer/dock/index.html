<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Occlara Dock</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="dock.css" />
</head>
<body>
  <!-- Just the floating ghost, no status dot, no bubble. Fully click-through;
       restore is Ctrl+Shift+M or the tray. The logo SVG is inlined so the
       pupils can aim at the center of the screen from wherever the dock sits. -->
  <div class="dock">
    <!-- The mark, inline rather than an img so it can inherit currentColor and
         tint with the dock's own state. Kept identical in geometry to
         assets/logo-mark.svg; change both or they drift. -->
    <svg class="mark" width="26" height="26" viewBox="0 0 64 64" fill="none"
         xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Occlara">
      <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="4.5"
              stroke-linecap="round" stroke-dasharray="45.454 9" transform="rotate(-90 32 32)"/>
      <circle cx="32" cy="32" r="15" fill="none" stroke="currentColor" stroke-width="3.5"
              stroke-linecap="round" stroke-dasharray="24.416 7" opacity="0.55" transform="rotate(-30 32 32)"/>
      <circle cx="32" cy="32" r="5" fill="currentColor"/>
    </svg>
  </div>
  <script src="../shared/i18n-apply.js"></script>
</body>
</html>
