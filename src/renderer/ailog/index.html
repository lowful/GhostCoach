<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>AI Log</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="ailog.css" />
</head>
<body>
  <header class="drag">
    <div class="h-brand">
      <img src="../../../assets/logo-mark.svg" alt="" width="17" height="17" />
      <div>
        <h2>AI Decision Log</h2>
        <span id="subtitle" class="sub">what the coach saw and said</span>
      </div>
    </div>
    <div class="h-right no-drag">
      <!-- Session picker. Only the frames of the chosen session are loaded, so
           switching costs one read rather than the viewer holding every session. -->
      <select id="session" class="session-pick" title="Choose a session" aria-label="Session"></select>
      <button id="close" class="icon-btn" title="Close" aria-label="Close">✕</button>
    </div>
  </header>

  <div id="empty" class="empty" hidden></div>

  <main id="main" class="main" hidden>
    <!-- Left: the frame the coach read -->
    <section class="frame-pane">
      <div class="frame-wrap">
        <img id="frame" alt="frame the coach analyzed" />
      </div>
      <div class="scrub no-drag">
        <button id="prev" class="nav-btn" title="Previous frame (Left arrow)">‹</button>
        <div class="track">
          <input id="slider" type="range" min="0" max="0" value="0" />
          <!-- Death reviews are pinned here, so you can find the moments that
               matter without scrubbing the whole session frame by frame. -->
          <div id="marks" class="marks" aria-hidden="true"></div>
        </div>
        <button id="next" class="nav-btn" title="Next frame (Right arrow)">›</button>
      </div>
      <!-- Riot's own record of the match, checked against the deaths read off
           the screen. Appears only once the check comes back. -->
      <div id="confirm" class="confirm" hidden></div>
      <div class="frame-meta">
        <span id="pos">0 / 0</span>
        <!-- The map this stretch of the session was confirmed to be on, which is
             not the same as the map the AI read on this one frame. -->
        <span id="seg" class="seg"></span>
        <span id="time" class="muted"></span>
      </div>
    </section>

    <!-- Right: what it parsed + said -->
    <section class="read-pane">
      <div class="block">
        <div class="lbl">Tip shown</div>
        <p id="shown" class="shown"></p>
      </div>
      <div class="block" id="raw-block" hidden>
        <div class="lbl">AI said (before filters)</div>
        <p id="raw" class="raw"></p>
        <p id="raw-why" class="why" hidden></p>
      </div>
      <div class="block">
        <div class="lbl">What the AI read (its notes)</div>
        <div id="state" class="state"></div>
      </div>

      <!-- Ask the coach about THIS frame; the screenshot goes with the question -->
      <div class="block ask">
        <div class="lbl">Ask about this moment</div>
        <div id="ask-log" class="ask-log"></div>
        <form id="ask-form" class="ask-row">
          <input id="ask-input" class="ask-input" type="text" autocomplete="off"
                 placeholder="Why did I die here?" maxlength="300" />
          <button id="ask-send" class="ask-send" type="submit" title="Ask">Ask</button>
        </form>
        <div class="ask-hints">
          <button type="button" class="hint" data-q="Why did I die here?">Why did I die here?</button>
          <button type="button" class="hint" data-q="What should I have done instead?">What should I have done?</button>
          <button type="button" class="hint" data-q="Where were the enemies at this moment?">Where were they?</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../shared/i18n-apply.js"></script>
  <script src="ailog.js"></script>
</body>
</html>
