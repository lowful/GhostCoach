<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Occlara History</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/tip-visuals.css" />
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Tip History</h2>
        <span id="count" class="count">0</span>
      </div>
      <div class="h-actions">
        <select id="session-picker" class="session-picker no-drag" title="Review a past session">
          <option value="">Current session</option>
        </select>
        <button id="open-ailog" class="icon-btn no-drag" title="Open the AI decision log for this session" aria-label="AI decision log">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 20h10"/><path d="M7 9h5"/><path d="M7 13h8"/></svg>
        </button>
        <button id="close" class="icon-btn no-drag" title="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      </div>
    </header>

    <div class="mixbar">
      <div class="mix-text">
        <span><span class="sw cyan"></span>AI <b id="mix-ai">0%</b></span>
        <span><span class="sw mute"></span>Library <b id="mix-lib">0%</b></span>
      </div>
      <div class="mix-track"><div class="mix-fill" id="mix-fill"></div></div>
    </div>

    <div class="body" id="list">
      <div class="empty" id="empty">No tips yet this session.</div>
    </div>
  </div>

  <script src="../shared/i18n-apply.js"></script>
  <script src="../shared/tip-visuals.js"></script>
  <script src="history.js"></script>
</body>
</html>
